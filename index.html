<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Class Dinner Registration</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .card {
      width: 100%;
      max-width: 480px;
      margin: 20px auto;
      background: white;
      border-radius: 18px;
      padding: 28px 22px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      margin-top: 8px;
      color: #666;
      font-size: 15px;
      line-height: 1.6;
    }

    .section {
      margin-top: 28px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .hint {
      font-size: 13px;
      color: #777;
      margin-bottom: 9px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #06c755;
    }

    .counter {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
      margin-top: 12px;
    }

    .counter button {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: #eee;
      font-size: 26px;
      cursor: pointer;
    }

    .counter span {
      width: 45px;
      text-align: center;
      font-size: 22px;
      font-weight: 600;
    }

    .submit {
      width: 100%;
      margin-top: 30px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #06c755;
      color: white;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .submit:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .status {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    .status.info {
      display: block;
      background: #f0f7ff;
      color: #336699;
    }

    .status.error {
      display: block;
      background: #fff0f0;
      color: #c00000;
    }

    .status.success {
      display: block;
      background: #edfff2;
      color: #137333;
    }

    #successArea {
      display: none;
      text-align: center;
    }

    .success-icon {
      font-size: 55px;
      margin-bottom: 10px;
    }

    .success-title {
      font-size: 23px;
      font-weight: 700;
      line-height: 1.5;
    }

    .success-text {
      margin-top: 12px;
      color: #666;
      line-height: 1.7;
    }

    .stats {
      margin-top: 22px;
      padding: 16px;
      background: #f7f7f7;
      border-radius: 12px;
      line-height: 1.8;
    }

  </style>

</head>


<body>

<div class="card">

  <!-- ============================= -->
  <!-- Registration Form -->
  <!-- ============================= -->

  <div id="formArea">

    <h1>
      🍽️ Class Dinner
    </h1>

    <div class="subtitle">

      期末考後班級聚餐報名<br>

      Class Dinner Registration

    </div>


    <!-- Name -->

    <div class="section">

      <label>
        姓名 / Name
      </label>

      <div class="hint">
        請輸入您的姓名 /
        Please enter your name
      </div>

      <input
        id="name"
        type="text"
        maxlength="50"
        placeholder="Name / 姓名"
      >

    </div>


    <!-- Number -->

    <div class="section">

      <label>
        人數 / Number of People
      </label>

      <div class="hint">
        請選擇參加人數 /
        Please select the number of people
      </div>

      <div class="counter">

        <button
          type="button"
          onclick="changePeople(-1)"
        >
          −
        </button>

        <span id="people">1</span>

        <button
          type="button"
          onclick="changePeople(1)"
        >
          ＋
        </button>

      </div>

    </div>


    <!-- Submit -->

    <button
      id="submitButton"
      class="submit"
      type="button"
      onclick="submitForm()"
      disabled
    >

      LINE連線中...
      / Connecting to LINE...

    </button>


    <div
      id="status"
      class="status"
    ></div>

  </div>


  <!-- ============================= -->
  <!-- Success -->
  <!-- ============================= -->

  <div id="successArea">

    <div class="success-icon">
      ✅
    </div>

    <div class="success-title">

      報名成功！<br>

      Registration Successful!

    </div>

    <div class="success-text">

      感謝您的報名！<br>

      Thank you for registering!

    </div>

    <div
      id="stats"
      class="stats"
    ></div>

  </div>

</div>


<script>


/* =========================================
   LIFF
   ========================================= */

const LIFF_ID =
  '2011361585-XZv0YkKm';


/* =========================================
   Google Apps Script
   ========================================= */

const GAS_URL =
  'https://script.google.com/macros/s/AKfycby5k4R0RdWJWg6V6epAyCvQJIemt3nuvULJQRVUIiJv8eHgwlCJI_XVhNHMav5CsBUn/exec';


/* =========================================
   Variables
   ========================================= */

let people = 1;

let lineUserId = '';

let liffReady = false;


/* =========================================
   Status
   ========================================= */

function showStatus(message, type) {

  const status =
    document.getElementById('status');

  status.textContent =
    message;

  status.className =
    'status ' + type;

}


function hideStatus() {

  const status =
    document.getElementById('status');

  status.style.display = 'none';

}


/* =========================================
   LIFF initialization
   ========================================= */

async function initLIFF() {

  try {

    if (typeof liff === 'undefined') {

      throw new Error(
        'LIFF SDK failed to load.'
      );

    }


    showStatus(
      'LINE連線中... / Connecting to LINE...',
      'info'
    );


    await liff.init({

      liffId: LIFF_ID

    });


    if (!liff.isLoggedIn()) {

      showStatus(
        '正在登入 LINE... / Logging in to LINE...',
        'info'
      );

      liff.login();

      return;

    }


    const profile =
      await liff.getProfile();


    if (!profile || !profile.userId) {

      throw new Error(
        'Unable to get LINE user information.'
      );

    }


    lineUserId =
      profile.userId;


    liffReady = true;


    const button =
      document.getElementById(
        'submitButton'
      );


    button.disabled = false;

    button.textContent =
      '送出報名 / Submit Registration';


    showStatus(
      'LINE連線成功，可以開始報名。 / LINE connected. You can register now.',
      'success'
    );


  } catch (error) {

    console.error(
      'LIFF initialization error:',
      error
    );


    showStatus(

      'LINE連線失敗 / LINE connection failed: ' +
      (error.message || error),

      'error'

    );

  }

}


/* =========================================
   People counter
   ========================================= */

function changePeople(amount) {

  people += amount;


  if (people < 1) {

    people = 1;

  }


  if (people > 10) {

    people = 10;

  }


  document.getElementById(
    'people'
  ).textContent =
    people;

}


/* =========================================
   JSONP helper
   ========================================= */

function jsonpRequest(params) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        'jsonpCallback_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement('script');


      let finished = false;


      const timeout =
        setTimeout(
          function() {

            if (finished) {
              return;
            }

            finished = true;

            cleanup();

            reject(
              new Error(
                'Request timed out. Please try again.'
              )
            );

          },
          15000
        );


      window[callbackName] =
        function(data) {

          if (finished) {
            return;
          }

          finished = true;

          clearTimeout(timeout);

          cleanup();

          resolve(data);

        };


      function cleanup() {

        delete window[callbackName];

        if (script.parentNode) {

          script.parentNode.removeChild(
            script
          );

        }

      }


      const query =
        new URLSearchParams({

          callback:
            callbackName,

          action:
            params.action || '',

          name:
            params.name || '',

          people:
            params.people || '',

          userId:
            params.userId || ''

        });


      script.src =
        GAS_URL +
        '?' +
        query.toString();


      script.onerror =
        function() {

          if (finished) {
            return;
          }

          finished = true;

          clearTimeout(timeout);

          cleanup();

          reject(
            new Error(
              'Unable to connect to Google Apps Script.'
            )
          );

        };


      document.body.appendChild(
        script
      );

    }
  );

}


/* =========================================
   Submit registration
   ========================================= */

async function submitForm() {

  const name =
    document
      .getElementById('name')
      .value
      .trim();


  const button =
    document.getElementById(
      'submitButton'
    );


  if (!name) {

    showStatus(
      '請輸入您的姓名。 / Please enter your name.',
      'error'
    );

    return;

  }


  if (!liffReady || !lineUserId) {

    showStatus(
      'LINE尚未連線完成。 / LINE is not ready yet.',
      'error'
    );

    return;

  }


  button.disabled = true;

  button.textContent =
    'Submitting... / 送出中...';


  showStatus(
    '正在提交報名... / Submitting registration...',
    'info'
  );


  try {


    const result =
      await jsonpRequest({

        action:
          'register',

        name:
          name,

        people:
          people,

        userId:
          lineUserId

      });


    if (!result || !result.success) {

      throw new Error(

        result &&
        result.message

          ? result.message

          : 'Registration failed.'

      );

    }


    /* ===============================
       Registration successful
       =============================== */

    document.getElementById(
      'formArea'
    ).style.display =
      'none';


    document.getElementById(
      'successArea'
    ).style.display =
      'block';


    document.getElementById(
      'stats'
    ).innerHTML =

      '目前報名人數 / Registrations: ' +

      result.registrations +

      '<br>' +

      '目前參加總人數 / Total People: ' +

      result.totalPeople;


  } catch (error) {


    console.error(
      'Registration error:',
      error
    );


    button.disabled = false;


    button.textContent =
      '送出報名 / Submit Registration';


    showStatus(

      error.message ||

      'Registration failed. Please try again.',

      'error'

    );

  }

}


/* =========================================
   Start
   ========================================= */

window.addEventListener(
  'load',
  function() {

    initLIFF();

  }
);


</script>

</body>

</html>
